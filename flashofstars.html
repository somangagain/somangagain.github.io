  return{...u,hp,base,t:`e:${fac}:${cls}`,max:hp,w:m7(u.w),sh:m7(u.sh),tint:FA[fac].c}}
const CHIEFSK=['doom','nova','hex','empwave','barrage','twin','provoke','aegis','missiles','curse'];
function chief(u){u.chief=true;u.elite=false;u.bn=u.n;u.n='우두머리 '+u.n;const m=2.2;u.hp=u.max=Math.round(u.max*m);u.base=Math.round(u.base*m);u.w=Math.min(7,u.w+2);u.sh=Math.min(7,u.sh+1);u.tgh=(u.tgh||0)+.25;if(!u.sk)u.sk=pick(CHIEFSK);return u}
function bossPhase(p,k){const c=chief(eUnit(p.fac,true,Math.min(7,p.tier+k)));c.n=(k===1?'각성한 ':'최후의 ')+c.bn;c.sk=pick(CHIEFSK);
  if(k===1){c.hp=c.max=Math.round(c.max*1.15);const out=[c];if(Math.random()<.6)out.push(eUnit(p.fac,true,p.tier));return out}

const phasesOf=p=>{const n=p.role==='hq'||p.tier>=4?2:p.tier>=2?1:0;return Array.from({length:n},(_,i)=>()=>bossPhase(p,i+1))};
function elite(u){u.elite=true;u.n='정예 '+u.n;u.hp=u.max=Math.round(u.max*1.6);u.base=Math.round(u.base*1.6);u.w=Math.min(7,u.w+1);u.sh=Math.min(7,u.sh+1);
  if(!u.sk)u.sk=pick(['volley','snipe','barrier','repair','burnall','rally','fortify','haste','pierce','vamp','regen','reflect','lunge','execute','chain','armorbreak','missiles','drain','curse','hexbreak','slowfield','plague','emp','provoke','empwave','barrage','twin','assist']);return u}
function gen(x,y){

  const early=S.exp<20;let n=(near?ri(3,5)+(t>3?1:0):(dE<=2?(early?ri(1,2):ri(2,3)):(early?ri(2,3):ri(3,5))))+(early?0:1);if(near&&(near.fac==='iron'||near.fac==='bio'))n--;

function planetFleet(p){const[b,s0]=FA[p.fac].mix,out=[],hq=p.role==='hq',s=Math.min(s0,Math.random()<.5?1:2);

function picketFleet(p){const t=p.tier,out=[];if(t>=3)out.push(eUnit(p.fac,true,t));
  for(let i=0;i<2+(t>=2?1:0)+(t>=4?1:0);i++)out.push(eUnit(p.fac,false,t));out.forEach(e=>e.n='경비 '+e.n);return out}

/* ---------- raids: enemy squads that hunt the fleet or strike a colony ---------- */
/* raids grow with the fleet's gear, the number of techs learned and the experience earned */
const raidTier=p=>clamp(Math.max(0,p.tier-1)+(pbonus()>>1)+Math.floor((Math.floor(techCount()/12)+Math.floor(S.exp/150))/2),1,6);
function spawnRaid(){const cols=PL.filter(p=>owned(p)&&!p.col.rebel);if(!cols.length||S.raids.length>=3)return;
  const reb=PL.filter(p=>owned(p)&&p.col.rebel),want=Math.min(3-S.raids.length,Math.random()<.15?3:Math.random()<.4?2:1),used=[],msgs=[];
  for(let k=0;k<want;k++){let pool=cols.filter(p=>!used.includes(p));if(!pool.length)pool=cols;const near=pool.filter(p=>reb.some(q=>cheb(p.x,p.y,q)<=4));
    const p=near.length&&Math.random()<.6?pick(near):pick(pool);used.push(p);const m=placeRaid(p);if(m)msgs.push(m)}
  if(msgs.length){sfx.alarm();toast(msgs.length>1?`습격대 ${msgs.length}곳 동시 출현! `+msgs.join(' / '):msgs[0])}}
function placeRaid(p){
  for(let t=0;t<40;t++){const an=rnd(0,6.28),d=ri(3,4),x=clamp(Math.round(p.x+Math.cos(an)*d),0,COLS-1),y=clamp(Math.round(p.y+Math.sin(an)*d),0,ROWS-1);
    if(PL.some(q=>q.x===x&&q.y===y)||Math.max(Math.abs(x-S.x),Math.abs(y-S.y))<2||S.raids.some(r=>r.x===x&&r.y===y))continue;
    const src=PL.filter(q=>!owned(q)).sort((a,b)=>cheb(x,y,a)-cheb(x,y,b))[0];
    const r={x,y,fac:src&&Math.random()<.6?src.fac:'pirate',tier:raidTier(p),tg:p.role==='earth'||Math.random()<.5?'fleet':'planet',pid:p.id,n:0};
    S.raids.push(r);return`${p.n} 근처에 ${FA[r.fac].n} 습격대 출현 · `+(r.tg==='fleet'?'우리 함대를 쫓습니다':'행성을 노립니다')}return null}
async function raidFight(r,ox,oy,world){const out=[eUnit(r.fac,true,r.tier)];for(let i=0;i<3+(r.tier>=4?1:0)+(r.tier>=6?1:0);i++)out.push(eUnit(r.fac,false,r.tier));if(Math.random()<.25)elite(out[ri(1,3)]);if(r.tier>=4&&Math.random()<.3)chief(out[0]);out.forEach(e=>e.n='습격 '+e.n);
  const res=await battle(out,{intro:`${FA[r.fac].n} 습격대와 맞붙었다!`});if(S!==world)return;
  if(res==='win')S.raids=S.raids.filter(z=>z!==r);else if(res==='flee'){S.x=ox;S.y=oy}}
async function raidPlanet(r,p){S.raids=S.raids.filter(z=>z!==r);const c=p.col,R=(15+12*r.tier)*rnd(.8,1.2),D=defense(p);
  if(D>=R){if(S.tech.d3)c.loy=Math.min(100,c.loy+3);beep(880,.2);c.ev={m:S.month,t:'습격 격퇴'};
    toast(`${p.n}의 방어 시설이 습격대를 격퇴했습니다`+(S.tech.d3?' · 충성도 +3':''));return}
  const loss=Math.round((12+2*r.tier)*(c.fac.includes('radar')?.5:1));c.loy=Math.max(0,c.loy-loss);const lost=[];
  const brk=()=>{if(c.fac.length)lost.push(FAC[c.fac.splice(ri(0,c.fac.length-1),1)[0]].n)};
  if(Math.random()<(R>D*1.5?1:.5)*(c.fac.includes('shieldgen')?.5:1))brk();if(R>D*2)brk();const lostF=lost.join(', ');
  c.ev={m:S.month,t:'습격 피해 (충성도 -'+loss+(lost.length?', 시설 '+lost.length+'곳 파손':'')+')'};beep(140,.4,'sawtooth',.06);ui();
  await msgBox('습격',`${FA[r.fac].n} 습격대가 ${p.n}을(를) 공격했습니다!\n충성도 -${loss}`+(lostF?`\n시설 파손: ${lostF}`:'\n시설은 무사합니다.')+`\n\n방어도 ${D} · 방어 시설을 늘리면 행성이 스스로 막아냅니다.`)}
async function raidStep(ox,oy,world){
  const here0=S.raids.find(z=>z.x===S.x&&z.y===S.y);
  if(here0){ui();await sleep(160);await raidFight(here0,ox,oy,world);return true}
  if(S.raids.length)await sleep(200);
  for(const r of S.raids.slice()){r.n++;let tp=r.tg==='planet'?PL.find(p=>p.id===r.pid):null;
    if(r.tg==='planet'&&(!tp||!owned(tp)||tp.col.rebel)){r.tg='fleet';tp=null}
    if(tp&&r.n%2)continue;
    const T=tp||{x:S.x,y:S.y};r.x+=Math.sign(T.x-r.x);r.y+=Math.sign(T.y-r.y);
    if(r.x===S.x&&r.y===S.y){ui();await sleep(300);await raidFight(r,ox,oy,world);return true}
    if(tp&&r.x===tp.x&&r.y===tp.y){await raidPlanet(r,tp);if(S!==world)return true}}
  if(S.exp>=20&&S.raids.length<3&&Math.random()<.04+.03*PL.filter(p=>owned(p)&&p.col.rebel).length)spawnRaid();
  return false}

async function move(dx,dy){if(busy||mode!=='map')return;const nx=S.x+dx,ny=S.y+dy;if(nx<0||ny<0||nx>=COLS||ny>=ROWS)return;

      if(p.role==='hq'){const sum=`${S.month}개월 만에 ${PL.filter(owned).length}개의 별을 품고, 기술 ${techCount()}개를 익혔습니다.`;await cine(ending());
        await msgBox('진정한 평화여','심연 군단의 본거지가 무너졌습니다.\n하람 4형제는 별들에 평화를 되찾았습니다.\n'+sum+'\n\n— 끝 —','새 은하로');setState(newState());save();await cine(opening());return}

function hit(tg,d,pierce,src){let dealt=0;

  if(src&&src.wk)d*=.7;

async function shot(s,tg,mult,pierce){

  const sure=s.crit;s.crit=0;
  if(!sure&&Math.random()<miss){fl(tg,'빗나감','#aab');return false}
  let d=wd(s)*rnd(.8,1.2)*mult*(s.atk?1.3:1)*(isE(s)?1.4:1)*(s.enr?1.3:1);
  if(sure){d*=2;fl(s,'필중 치명타','#ffcc55')}
  if(s.foc&&Math.random()<.2){d*=1.5;fl(s,'치명타','#ffcc55')}
  if(!isE(s)&&S.tech.t1&&Math.random()<.1){d*=1.5;fl(s,'치명타','#ffcc55')}
  if(!isE(s)&&S.tech.k0&&B.focus===tg)d*=1.15;
  hit(tg,d,pierce,s);
  if(s.venom&&tg.hp>0&&Math.random()<.2)afflict(tg,'psn',3,'독','#b0ff40');
  return true}

    case 3:for(let i=0;i<2&&tg.hp>0&&s.hp>0;i++){await shot(s,tg,.55);if(i<1)await bs(d*.45)}break;
    case 4:{const c=Math.random()<.2;if(c)fl(s,'치명타','#ffcc55');await shot(s,tg,c?1.8:1);break}
    case 5:for(let i=0;i<3&&tg.hp>0&&s.hp>0;i++){await shot(s,tg,.4);if(i<2)await bs(d*.35)}break;
    case 6:if(await shot(s,tg,1)&&tg.hp>0&&Math.random()<.35)afflict(tg,'burn',3,'화상','#ff9955');break;
    case 7:{await shot(s,tg,1,Math.random()<.25);const o=lf.filter(x=>x!==tg&&x.hp>0);
      if(o.length&&s.hp>0){const t2=pick(o);beam(s,t2,7);hit(t2,wd(s)*.35*(isE(s)?1.4:1),false,s)}break}
    case 8:{await shot(s,tg,1);const o=lf.filter(x=>x!==tg&&x.hp>0).sort(()=>Math.random()-.5).slice(0,2);for(const t2 of o){if(s.hp<=0)break;beam(s,t2,20);hit(t2,wd(s)*.35,false,s)}break}

    case 11:{await shot(s,tg,1);for(const t2 of lf.filter(x=>x!==tg&&x.hp>0)){if(s.hp<=0)break;beam(s,t2,23);hit(t2,wd(s)*.3,false,s)}break}

/* ---------- loop and input ---------- */
function frame(t){if(C)drawCine(t);else if(mode==='battle'&&B)drawBattle(t);else drawMap(t);requestAnimationFrame(frame)}
function setSpd(v){spd=v;$('bSpd').innerHTML=fic('speed')+spd+'배속';saveSet()}
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(typing){if(!e.isComposing&&(k==='Enter'||k==='Escape')&&keyFn){keyFn(k);e.preventDefault()}return}
  if(keyFn){if(k.length===1||/^Key[A-Z]$/.test(e.code)||['Enter','Escape','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)){sfx.click();keyFn(k,e.code);e.preventDefault()}return}
  if(mode!=='map'||busy)return;
  const mv={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[k]||{KeyW:[0,-1],KeyS:[0,1],KeyA:[-1,0],KeyD:[1,0]}[e.code];
  if(mv){e.preventDefault();move(mv[0],mv[1])}
  else if(/^[0-9]$/.test(k)){e.preventDefault();if(cmds()[+k||10])sfx.click();run(+k||10)}
  else if(k==='F1'){e.preventDefault();help()}
  else if(k==='Escape'){e.preventDefault();sysMenu()}
});
const cpos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
cmd.addEventListener('click',e=>{const b=e.target.closest('button[data-n]');if(b)run(+b.dataset.n)});
cv.addEventListener('mousemove',e=>{hover=cpos(e)});
cv.addEventListener('mouseleave',()=>{hover=null});
cv.addEventListener('click',e=>{const{x,y}=cpos(e);
  if(mode==='cine'){cineNext();return}
  if(mode==='battle'){if(targetFn)targetFn(x,y);return}
  if(x>=420||y>=310)return;
  const dx=Math.floor((x-OX)/CELL)-S.x,dy=Math.floor((y-OY)/CELL)-S.y;if(!dx&&!dy)return;
  if(Math.abs(dx)>=Math.abs(dy))move(Math.sign(dx),0);else move(0,Math.sign(dy))});
[['pU',0,-1],['pD',0,1],['pL',-1,0],['pR',1,0]].forEach(([id,dx,dy])=>$(id).addEventListener('click',()=>move(dx,dy)));
$('bSpd').addEventListener('click',()=>setSpd(spd%3+1));
$('bFull').addEventListener('click',()=>{try{if(document.fullscreenElement)document.exitFullscreen();else{const p=$('stage').requestFullscreen();if(p&&p.catch)p.catch(()=>toast('이 화면에서는 전체 화면을 쓸 수 없습니다.'))}}catch(e){toast('이 화면에서는 전체 화면을 쓸 수 없습니다.')}});
document.addEventListener('fullscreenchange',()=>{try{const kb=navigator.keyboard;if(!kb)return;if(document.fullscreenElement){if(kb.lock)kb.lock(['Escape']).catch(()=>{})}else if(kb.unlock)kb.unlock()}catch(e){}});
/* ---------- in-game menu: save slots, load, settings ---------- */
const SLOTK=n=>'flashofstars-slot'+n;
const sumOf=st=>`${st.month}개월 · 영토 ${1+Object.keys(st.conq).length} · 전함 ${st.fleet.length}척 · 자금 ${st.money}만원`;
function slotGet(n){try{const o=JSON.parse(localStorage.getItem(SLOTK(n)));const st=o&&sanitize(o.s);return st?{t:o.t,st}:null}catch(e){return null}}
const when=t=>{const d=new Date(t),p=v=>String(v).padStart(2,'0');return`${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`};
async function sysMenu(){if(busy||mode!=='map')return;busy=true;sfx.click();
  try{for(;;){
    const c=await listBox('메뉴',[{label:'계속하기'},{label:'저장하기',sub:'슬롯 3개 · 파일로 내보내기'},{label:'불러오기',sub:'자동 저장 · 슬롯 · 파일'},{label:'도움말'},
      {label:'효과음 '+(snd?'켜짐':'꺼짐')},{label:'음악 '+(bgm?'켜짐':'꺼짐')},{label:'전투 속도 '+spd+'배속'},{label:'새 게임',sub:'새 은하에서 다시 시작'}],'','진행 상황은 이동할 때마다 자동 저장됩니다.');
    if(c<=0)break;
    if(c===1){const its=[1,2,3].map(n=>{const s=slotGet(n);return{label:'슬롯 '+n,sub:s?when(s.t)+' · '+sumOf(s.st):'비어 있음'}});its.push({label:'파일로 내보내기',sub:'다른 기기에서 불러올 수 있습니다'});
      const i=await listBox('저장하기',its,'','저장할 곳을 고르세요.');
      if(i>=0&&i<3){try{save();localStorage.setItem(SLOTK(i+1),JSON.stringify({t:Date.now(),s:S}));toast(`슬롯 ${i+1}에 저장했습니다.`)}catch(e){toast('이 브라우저에서는 슬롯 저장을 쓸 수 없습니다.')}break}
      if(i===3){await exportFile();break}continue}
    if(c===2){const auto=load(),sl=[1,2,3].map(slotGet);
      const its=[{label:'자동 저장',sub:auto?sumOf(auto):'없음',off:!auto},...sl.map((s,n)=>({label:'슬롯 '+(n+1),sub:s?when(s.t)+' · '+sumOf(s.st):'비어 있음',off:!s})),{label:'파일에서 불러오기',sub:'.json 세이브 파일'}];
      const i=await listBox('불러오기',its,'','지금 진행 중인 게임은 불러온 내용으로 바뀝니다.');
      if(i===0&&auto){setState(auto);toast('자동 저장을 불러왔습니다.');break}
      if(i>=1&&i<=3&&sl[i-1]){setState(sl[i-1].st);save();toast(`슬롯 ${i}을(를) 불러왔습니다.`);break}
      if(i===4){busy=false;$('fLoad').value='';$('fLoad').click();return}continue}
    if(c===3){busy=false;await help();busy=true;continue}
    if(c===4){snd=!snd;saveSet();continue}
    if(c===5){bgm=!bgm;if(musG)musG.gain.value=bgm?.55:0;mus.next=0;saveSet();continue}
    if(c===6){setSpd(spd%3+1);continue}
    if(c===7){const k=await listBox('새 게임',[{label:'새 은하에서 다시 시작한다',sub:'행성 배치가 새로 만들어집니다'}],'','지금까지의 진행 상황(자동 저장)이 지워집니다. 슬롯 저장은 남습니다.');
      if(k===0){setState(newState());save();await cine(opening());break}continue}}
  }finally{busy=false;ui()}}
$('bMenu').addEventListener('click',sysMenu);
$('bMenu2').addEventListener('click',sysMenu);

/* ---------- save files ---------- */
function sanitize(o){
  if(!o||typeof o!=='object'||o.v!==2||!Array.isArray(o.fleet)||!Array.isArray(o.pl))return null;
  const num=(v,lo,hi,d)=>Number.isFinite(+v)?Math.max(lo,Math.min(hi,Math.round(+v))):d;
  const flags=(v,ok)=>{const r={};if(v&&typeof v==='object')for(const k of Object.keys(v))if(v[k]&&ok(k))r[k]=true;return r};
  const name=(v,d)=>typeof v==='string'&&/^[가-힣A-Za-z0-9 ]{1,24}$/.test(v)?v:d;
  const roles=['earth','pirate','gold','heon','lover','ok','bonus','hq'];
  const pl=o.pl.slice(0,16).map((p,i)=>{if(!p||typeof p!=='object')return null;
    const type=PT[p.type]?p.type:'rock',size=num(p.size,0,2,1);
    const q={id:'p'+i,n:name(p.n,'이름 없는 별 '+i),x:num(p.x,0,COLS-1,0),y:num(p.y,0,ROWS-1,0),type,size,role:roles.includes(p.role)?p.role:'bonus',
      tier:num(p.tier,0,6,1),fac:FA[p.fac]?p.fac:'legion',seed:num(p.seed,0,9999,0),ring:!!p.ring,pre:FAC[p.pre]?p.pre:null};
    if(p.col&&typeof p.col==='object')q.col={loy:num(p.col.loy,0,100,50),tax:num(p.col.tax,0,2,1),fac:(Array.isArray(p.col.fac)?p.col.fac:[]).filter(f=>FAC[f]).slice(0,7),rebel:!!p.col.rebel,martial:!!p.col.martial,fest:num(p.col.fest,0,99999,0)};
    return q});
  if(pl.includes(null)||pl.length<3||pl[0].role!=='earth'||pl.filter(p=>p.role==='hq').length!==1||pl.filter(p=>p.role==='earth').length!==1)return null;
  if(!pl[0].col)pl[0].col={loy:100,tax:1,fac:['yard','arsenal','lab'],rebel:false};pl[0].col.rebel=false;
  const ids=pl.map(p=>p.id),conq=flags(o.conq,k=>ids.includes(k)&&k!=='p0');
  for(const p of pl.slice(1)){if(conq[p.id]&&!p.col)p.col={loy:30,tax:1,fac:[],rebel:false};if(!conq[p.id])delete p.col}
  const ships=(a,n)=>(Array.isArray(a)?a:[]).slice(0,n).filter(s=>s&&TY[s.t]).map(s=>{const max=num(s.max,1,999,TY[s.t].hp);
    const r={t:s.t,n:cleanName(s.n)||TY[s.t].n,max,hp:num(s.hp,1,max,max),w:num(s.w,-1,11,-1),sh:num(s.sh,-1,11,-1),xp:num(s.xp,0,9999,0)};
    if(typeof s.tint==='string'&&/^#[0-9a-f]{3,6}$/i.test(s.tint))r.tint=s.tint;return r});
  const fleet=ships(o.fleet,8),hangar=ships(o.hangar,11);
  const raids=(Array.isArray(o.raids)?o.raids:[]).slice(0,4).filter(r=>r&&FA[r.fac]).map(r=>({x:num(r.x,0,COLS-1,0),y:num(r.y,0,ROWS-1,0),fac:r.fac,tier:num(r.tier,1,6,1),tg:r.tg==='planet'?'planet':'fleet',pid:typeof r.pid==='string'&&/^p\d{1,2}$/.test(r.pid)?r.pid:'p0',n:num(r.n,0,1e9,0)}));
  if(!fleet.some(s=>BRO.includes(s.t)))return null;
  const cell=k=>/^\d{1,2},\d{1,2}$/.test(k),tiles={};
  if(o.tiles&&typeof o.tiles==='object')for(const k of Object.keys(o.tiles).slice(0,80))if(cell(k)&&(o.tiles[k]==='a'||o.tiles[k]==='n'))tiles[k]=o.tiles[k];
  let worm=null;if(Array.isArray(o.worm)&&o.worm.length===2&&o.worm.every(q=>Array.isArray(q)&&q.length===2))worm=o.worm.map(q=>[num(q[0],0,COLS-1,0),num(q[1],0,ROWS-1,0)]);
  const tech=flags(o.tech,k=>!!TB[k]);tech.w0=true;const prog={};
  if(o.prog&&typeof o.prog==='object')for(const k of Object.keys(o.prog))if(TB[k]&&!tech[k])prog[k]=num(o.prog[k],0,100,0);
  return{v:2,x:num(o.x,0,COLS-1,pl[0].x),y:num(o.y,0,ROWS-1,pl[0].y),money:num(o.money,0,9999999,0),exp:num(o.exp,0,99999,0),
    loy:num(o.loy,0,100,80),moves:num(o.moves,0,1e9,0),month:num(o.month,1,99999,1),fights:num(o.fights,0,1e9,0),tech,prog,rsch:TB[o.rsch]&&!tech[o.rsch]?o.rsch:null,fleet,hangar,raids,pl,tiles,worm,
    conq,info:flags(o.info,k=>ids.includes(k)),guard:flags(o.guard,cell),joined:flags(o.joined,k=>['gu','ok','heon'].includes(k)),lover:!!o.lover}}
function textBox(title,text,value){return new Promise(res=>{
  openDlg(`<div class="win"><h2>${title}</h2><div class="body"><div class="txt">${text}</div><textarea id="saveText" readonly></textarea></div><div class="foot"><button data-i="1">${fic('copy')}복사</button><button data-i="0">${fic('ok')}닫기</button></div></div>`);
  const ta=$('saveText');ta.value=value;
  const done=()=>{closeDlg();res()};
  dlg.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.i==='1'){ta.select();const ok=()=>toast('복사했습니다.');try{navigator.clipboard.writeText(value).then(ok,()=>toast('선택된 내용을 직접 복사하세요.'))}catch(err){toast('선택된 내용을 직접 복사하세요.')}}else done()};
  keyFn=k=>{if(k==='Enter'||k==='Escape')done();return true};})}
async function exportFile(){
  {save();const d=new Date(),pad=n=>String(n).padStart(2,'0');
    const fname=`별빛 섬광 ${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
    const data=JSON.stringify({game:'flashofstars',version:2,saved:d.toISOString(),state:S},null,1);
    const fallback='이 화면에서는 파일 저장을 쓸 수 없습니다. 아래 내용을 복사해 .json 파일로 저장하면 불러오기에 쓸 수 있습니다.';
    let dn=null;try{dn=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
    if(dn){try{await dn.save({filename:fname,data});toast('세이브 파일을 저장했습니다.')}
      catch(e){const c=e&&e.code;
        if(c==='declined')toast('저장을 취소했습니다.');
        else if(c==='rate_limited')toast('저장 창이 이미 열려 있습니다. 잠시 뒤 다시 누르세요.');
        else await textBox('세이브 내보내기',fallback,data)}}
    else await textBox('세이브 내보내기',fallback,data);
  }}
function loadFile(file){if(!file)return;if(busy||mode!=='map'){toast('전투나 창을 끝낸 뒤 불러오세요.');return}
  const fr=new FileReader();
  fr.onerror=()=>toast('파일을 읽지 못했습니다.');
  fr.onload=async()=>{let st=null,old=false;try{const o=JSON.parse(fr.result);old=o&&o.version===1;st=sanitize(o&&o.state?o.state:o)}catch(e){}
    if(!st){toast(old?'이전 버전 세이브는 새 은하 구조와 맞지 않아 불러올 수 없습니다.':'별빛 섬광 세이브 파일이 아닙니다.');return}
    if(busy||mode!=='map')return;busy=true;
    const c=await listBox('세이브 불러오기',[{label:'이 파일로 이어서 한다',sub:`${st.month}개월 · 영토 ${1+Object.keys(st.conq).length} · 전함 ${st.fleet.length}척 · 자금 ${st.money}만원`}],'','지금 진행 중인 게임은 불러온 내용으로 바뀝니다.');
    if(c===0){setState(st);save();toast('세이브를 불러왔습니다.')}
    busy=false;ui()};
  fr.readAsText(file)}
$('fLoad').addEventListener('change',e=>loadFile(e.target.files[0]));
scr.addEventListener('dragover',e=>e.preventDefault());
scr.addEventListener('drop',e=>{e.preventDefault();loadFile(e.dataTransfer.files[0])});

async function title(){
  const sv=load();setState(sv||newState());ui();busy=true;
  const items=sv?[{label:'이어하기',sub:`${sv.month}개월 · 영토 ${1+Object.keys(sv.conq).length} · 전함 ${sv.fleet.length}척`},{label:'새 게임',sub:'새 은하'}]:[{label:'게임 시작'}];
  const c=await listBox('',items,'방향키/WASD 이동 · 숫자키 명령',
    `<div class="logo"><span>${['#5a78ff','#ee3333','#5fd0c0','#ff7ad0','#9be04a','#ffb040','#b9a8ff'].map(c=>`<i style="background:${c}"></i>`).join('')}</span><b>별빛 섬광</b></div>`+
    '지구 근처 우주에 낯선 인공 행성들이 나타났다. 실종된 동생과 둘째 형이 그 어딘가에 잡혀 있다는 소문이 돈다.\n지구 방위군은 이번에는 돕지 않는다. 큰형 한울만이 지구 근처의 전투를 돕기로 했다.','title');
  if(sv&&c===1){setState(newState());save()}
  save();if(!sv||c===1)await cine(opening());
  busy=false;ui();
}
setState(newState());fit();$('bSpd').innerHTML=fic('speed')+spd+'배속';$('bMenu2').innerHTML=fic('menu')+'메뉴';$('bFull').innerHTML=fic('full')+'전체 화면';
requestAnimationFrame(frame);title();
if(document.fonts&&document.fonts.load)document.fonts.load('24px "Do Hyeon"').catch(()=>{});
})();
</script>
