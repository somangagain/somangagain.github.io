<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>별빛 섬광</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap">
<style>
/* layout: one 640x400 DOS screen in a dark bezel, touch deck beneath; under 600px the panels unstack below the map */
:root{
  --desk:#0b0908; --bezel:#1a1512; --space:#07060f; --olive:#2a2420; --olive-hi:#8a6f4e; --olive-lo:#14100d; --olive-ink:#d8cbb8;
  --brown:#3a2c22; --brown-hi:#a07a52; --brown-lo:#1a120c; --brown-ink:#f3e8d8; --yellow:#ffc857; --leaf:#ffb38a;
  --line:#3a302a; --sky:#9fe0d0; --muted:#a2968a; --cream:#f5eee2; --bad:#ff5a3c; --good:#6fe06f;
  --ui:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--desk);color:var(--cream)}
body{font-family:var(--ui);padding-inline:16px;padding-block:20px 32px}
.wrap{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.top h1{margin:0;font-size:30px;font-weight:400;color:var(--yellow);letter-spacing:.04em}
.top h1 span{font-size:15px;color:var(--muted);letter-spacing:.2em;margin-left:8px}
.top p{margin:0;color:var(--muted);font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.stat,.cmd,.bbar,.win{box-sizing:border-box}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

.stage{background:var(--bezel);padding:10px;border-radius:10px;border:1px solid var(--line)}
.stage:fullscreen{display:grid;place-items:center;background:#000;border:0;border-radius:0;padding:0}
.stage:fullscreen .screen{width:min(100vw,160vh)}
.screen{position:relative;width:100%;aspect-ratio:640/400;container-type:inline-size;
  background:var(--space);overflow:hidden;--u:calc(100cqw/640)}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}

.stat{position:absolute;right:0;top:0;width:34.375%;height:77.5%;background:var(--brown);color:var(--brown-ink);
  border:calc(2*var(--u)) solid;border-color:var(--brown-hi) var(--brown-lo) var(--brown-lo) var(--brown-hi);
  padding:calc(6*var(--u)) calc(12*var(--u));font-size:calc(20*var(--u));line-height:1.1;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;gap:calc(4*var(--u))}
.stat dl{margin:0;display:flex;flex-direction:column;gap:calc(4*var(--u))}
.stat dl div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 calc(6*var(--u))}
.stat dd{margin:0;color:var(--yellow);font-variant-numeric:tabular-nums}
.stat dd small{font-size:.65em;color:var(--brown-ink);opacity:.8}
.stat dd.chg{animation:chg .7s}
@keyframes chg{0%{color:#fff;transform:scale(1.25)}100%{transform:none}}
.stat .bar i{flex-basis:100%;height:calc(5*var(--u));margin-top:calc(2*var(--u));
  background:linear-gradient(to right,var(--yellow) var(--v),rgba(0,0,0,.35) var(--v))}
.stat .bar.warn i{background:linear-gradient(to right,var(--bad) var(--v),rgba(0,0,0,.35) var(--v))}
.stat .bar.warn dd{color:#ffd0c0}
.stat .hp{display:flex;gap:calc(3*var(--u));height:calc(13*var(--u));flex:none}
.stat .hp span{flex:1;max-width:12%;background:linear-gradient(to top,var(--c) var(--v),rgba(0,0,0,.4) var(--v));
  border-top:calc(2*var(--u)) solid transparent}
.stat .hp span.bro{border-top-color:var(--yellow)}
.stat .loc{margin:0;color:var(--leaf);font-size:calc(20*var(--u));line-height:1.05;display:flex;flex-direction:column}
.stat .loc small{font-size:.66em;color:var(--brown-ink);line-height:1.2}

.cmd{position:absolute;left:0;bottom:0;width:100%;height:22.5%;background:var(--olive);color:var(--olive-ink);
  border:calc(2*var(--u)) solid;border-color:var(--olive-hi) var(--olive-lo) var(--olive-lo) var(--olive-hi);
  display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1fr;
  padding:calc(4*var(--u)) calc(10*var(--u));font-size:calc(20*var(--u))}
.cmd button{text-align:left;white-space:nowrap;display:flex;align-items:center;gap:calc(5*var(--u))}
.cmd button.off{visibility:hidden}
kbd{font:inherit;color:var(--yellow);border:1px solid currentColor;padding:0 .28em;line-height:1.12;text-align:center;flex:none}
.cmd small{font-size:.68em;color:var(--yellow)}
.cmd .dot{width:.4em;height:.4em;background:var(--yellow);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.cmd button:hover,.bbar button:hover{color:#fff}

.bbar{position:absolute;left:0;right:0;bottom:0;height:17.5%;background:var(--olive);color:var(--cream);
  border:calc(2*var(--u)) solid;border-color:var(--olive-hi) var(--olive-lo) var(--olive-lo) var(--olive-hi);
  padding:calc(3*var(--u)) calc(12*var(--u));font-size:calc(15*var(--u));line-height:1.15;
  display:flex;flex-direction:column;justify-content:space-between}
.blog{display:flex;flex-direction:column;min-height:2.3em}
#bprev{opacity:.5}
.brow{display:flex;justify-content:space-between;align-items:center;gap:calc(12*var(--u));color:var(--olive-ink);font-size:calc(21*var(--u))}
#bbtns{display:flex;gap:calc(22*var(--u));flex-wrap:wrap}
#bbtns button{display:flex;gap:calc(6*var(--u));align-items:center}
#bSpd{color:var(--yellow);white-space:nowrap}

#toast{position:absolute;left:50%;top:calc(10*var(--u));transform:translateX(-50%);z-index:5;pointer-events:none;
  background:rgba(14,10,8,.92);border:1px solid var(--yellow);color:var(--cream);padding:.25em .8em;
  font-size:max(12px,calc(18*var(--u)));white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}

.dlg{position:absolute;inset:0;z-index:6;background:rgba(8,6,4,.74);display:flex;flex-direction:column;justify-content:center;
  padding:calc(12*var(--u));font-size:max(10px,calc(19*var(--u)));line-height:1.35}
.win{background:var(--olive);color:var(--olive-ink);display:flex;flex-direction:column;min-height:0;max-height:100%;
  border:calc(2*var(--u)) solid;border-color:var(--olive-hi) var(--olive-lo) var(--olive-lo) var(--olive-hi);
  box-shadow:0 0 0 calc(2*var(--u)) #000}
.win.full{flex:1}
.win h2{margin:0;font-weight:400;color:var(--yellow);font-size:1.3em;background:var(--olive-lo);padding:.1em .6em}
.win .body{padding:.5em .8em;display:flex;flex-direction:column;gap:.4em;overflow:auto;flex:1;min-height:0}
.win .txt{white-space:pre-line;color:var(--cream)}
.win textarea{width:100%;box-sizing:border-box;height:7em;background:#0e0b09;color:var(--cream);border:1px solid var(--olive-hi);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:none}
.win .list{display:flex;flex-direction:column}
.win .list button{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:.5em;text-align:left;padding:.08em .3em}
.win .list button:hover:not(:disabled){background:rgba(255,255,255,.1);color:#fff}
.win .list button small{color:var(--cream);opacity:.75;font-size:.72em;margin-left:.6em}
.win .list button .r{color:var(--yellow);font-variant-numeric:tabular-nums}
.win button:disabled{opacity:.42;cursor:default}
.win .foot{display:flex;justify-content:space-between;align-items:center;gap:1em;padding:.25em .8em;background:var(--olive-lo)}
.win .foot .note{color:var(--cream);min-width:0}
.win .foot button{white-space:nowrap;color:var(--yellow);display:flex;gap:.4em;align-items:center}
.tree{position:relative;flex:1;min-height:0;margin:calc(4*var(--u)) calc(6*var(--u))}
.tree svg{position:absolute;inset:0;width:100%;height:100%}
.tn{position:absolute;width:18.8%;height:14.6%;box-sizing:border-box;background:var(--olive-lo);border:1px solid var(--olive-hi);
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:0;padding:0 .3em;text-align:left;line-height:1.15;overflow:hidden;font-size:.82em}
.tn b{font-weight:400;white-space:nowrap;display:flex;align-items:center;gap:.25em;color:var(--cream)}
.tn b kbd{font-size:.8em}
.tn small{font-size:.74em;color:var(--olive-ink)}
.tn i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(to right,var(--yellow) var(--v),transparent var(--v))}
.tn.lock{opacity:.45}
.tn.done{background:#4a3a14;border-color:var(--yellow)}
.tn.done b{color:var(--yellow)}
.tn.sel{outline:2px solid #fff;outline-offset:-1px}
.tn img.ic{margin-right:0}
.win .foot .fb{display:flex;gap:1.2em;flex:none}
.win .foot .note{font-size:.86em;line-height:1.25}
.compact .tn{font-size:9px;padding:0 2px}
.compact .tn b{white-space:normal}
.compact .tn kbd,.compact .tn img.ic{display:none}
.dlg.title{background:rgba(8,6,4,.55)}
.logo{display:flex;flex-direction:column;align-items:center;gap:.1em;padding-block:.2em}
.logo b{font-weight:400;font-size:2.6em;line-height:1.1;color:var(--yellow);letter-spacing:.12em;text-shadow:.06em .06em 0 #6a2a40}
.logo span{display:flex;gap:.5em}
.logo span i{width:.5em;height:.5em;display:block}
.fleet{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(2*var(--u));background:#000;flex:1;min-height:0}
.card{background:var(--olive);display:flex;flex-direction:column;align-items:center;line-height:1.12;
  font-size:calc(19*var(--u));padding-bottom:calc(2*var(--u));min-width:0;position:relative}
.card:not(.dim):hover{background:#3d332b}
.card canvas{width:100%;background:#000;image-rendering:pixelated;display:block}
.card b{font-weight:400;color:var(--cream);letter-spacing:.2em;margin-top:calc(2*var(--u))}
.card i{font-style:normal;color:var(--yellow)}
.card small{font-size:calc(16*var(--u));color:var(--sky)}
.card em{font-style:normal;color:var(--cream);font-variant-numeric:tabular-nums;width:86%;text-align:center;
  background:linear-gradient(to right,var(--c) var(--v),rgba(0,0,0,.45) var(--v));margin-top:auto}
.card kbd{position:absolute;left:calc(4*var(--u));top:calc(4*var(--u));background:#000;font-size:.8em}
.card.dim{opacity:.45;cursor:default}
img.ic{height:1em;width:1em;image-rendering:pixelated;vertical-align:-.14em;margin-right:.3em}
img.sic{height:.8em;width:2.05em;image-rendering:pixelated;vertical-align:-.06em}

.screen.compact{aspect-ratio:auto;display:flex;flex-direction:column}
.compact #cv{position:static;height:auto}
.compact .stat{position:static;width:auto;height:auto;font-size:15px;padding:8px 12px;border-width:2px;gap:6px}
.compact .stat dl{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.compact .stat .bar i{height:4px;margin-top:2px}
.compact .stat .hp{height:12px;gap:3px}
.compact .stat .loc{font-size:16px;flex-direction:row;gap:10px;align-items:baseline}
.compact .cmd{position:static;height:auto;font-size:15px;display:flex;flex-wrap:wrap;gap:0 14px;padding:4px 10px;border-width:2px;min-height:88px;align-content:center}
.compact .cmd button.off{display:none}
.compact .cmd button{min-height:40px;gap:4px}
.compact .bbar{position:static;height:auto;font-size:13px;padding:6px 10px;border-width:2px;gap:6px}
.compact .brow{font-size:16px}
.compact #bbtns{gap:6px 14px}
.compact #bbtns button{min-height:34px}
.compact .dlg{font-size:14px;padding:8px}
.compact .card{font-size:11px}
.compact .card small{font-size:10px}

.deck{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px}
.dpad button{border:1px solid var(--line);background:#1c1714;color:var(--olive-ink);font-size:20px;border-radius:4px}
.dpad button:active{background:var(--olive)}
.side{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px}
.side p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
.side .row{display:flex;flex-wrap:wrap;gap:8px}
.side .row button{border:1px solid var(--line);padding:6px 14px;color:var(--olive-ink);font-size:16px;border-radius:4px}
.side .row button:hover{color:var(--yellow)}
@media (prefers-reduced-motion:reduce){.cmd .dot,.stat dd.chg{animation:none}}
</style>

<main class="wrap">
  <header class="top">
    <h1>별빛 섬광</h1>
  </header>

  <div class="stage" id="stage">
    <div class="screen" id="screen">
      <canvas id="cv" width="640" height="400"></canvas>
      <aside class="stat" id="stat"></aside>
      <nav class="cmd" id="cmd"></nav>
      <div class="bbar" id="bbar" hidden>
        <div class="blog"><span id="bprev"></span><span id="bmsg"></span></div>
        <div class="brow"><div id="bbtns"></div><button id="bSpd">속도 ×1</button></div>
      </div>
      <div id="toast" role="status"></div>
      <section class="dlg" id="dlg" hidden></section>
    </div>
  </div>

  <div class="deck">
    <div class="dpad" aria-label="이동">
      <span></span><button id="pU" aria-label="위">▲</button><span></span>
      <button id="pL" aria-label="왼쪽">◀</button><span></span><button id="pR" aria-label="오른쪽">▶</button>
      <span></span><button id="pD" aria-label="아래">▼</button><span></span>
    </div>
    <div class="side">
      <p>방향키나 WASD로 함대를 움직이고 숫자키로 명령을 내립니다. 지도를 눌러도 한 칸씩 이동합니다. 전투 중 스페이스로 속도를 바꿉니다. 진행 상황은 이 브라우저에 자동 저장되고, 파일로 내보내 다른 기기에서 불러올 수도 있습니다.</p>
      <div class="row">
        <button id="bHelp">도움말</button>
        <button id="bSnd">소리 켜짐</button>
        <button id="bFull">전체 화면</button>
        <button id="bSave">파일로 저장</button>
        <button id="bLoad">파일 불러오기</button>
        <button id="bNew">새 게임</button>
        <input type="file" id="fLoad" accept=".json,application/json" hidden>
      </div>
    </div>
  </div>
</main>

<script>
(()=>{

const scr=$('screen'),stat=$('stat'),cmd=$('cmd'),bbar=$('bbar'),bmsg=$('bmsg'),bprev=$('bprev'),bb=$('bbtns'),dlg=$('dlg'),toastEl=$('toast');

        `<small>${st==='done'?'개발 완료':pr?`연구 ${pr}%`:`${t.cost}만 · 경험 ${t.exp}`}</small>${st!=='done'&&pr?`<i style="--v:${pr}%"></i>`:''}</button>`}).join('');
    openDlg(`<div class="win full"><h2>과학 기술</h2><div class="tree"><svg viewBox="0 0 500 600" preserveAspectRatio="none">${lines}</svg>${nodes}</div>`+

      `<span class="fb">${st0==='open'?`<button data-act="go"><kbd>↵</kbd>${pr0>=100?'완성':'투자 +20% ('+step+'만)'}</button>`:''}<button data-act="x"><kbd>0</kbd>나가기</button></span></div></div>`);

      if(b.dataset.act==='x')return done();

      if(b.dataset.t){if(sel===b.dataset.t&&tstate(TB[sel])==='open')invest(TB[sel]);sel=b.dataset.t;ui();render()}};

async function colony(p){const c=p.col,T=PT[p.type],earth=p.role==='earth';

      (earth?'본성 · 반란 없음':`충성도 ${c.loy}% (${sign(dl(p))}/월) · 세율 ${TAX[c.tax]}`)+` · 수입 +${inc(p)}만원/월\n`+
      `시설 ${c.fac.length}/${slots(p)}: ${c.fac.map(f=>FAC[f].n).join(', ')||'없음'}`;
    const i=await listBox(`${p.n} 내정`,[

      {label:'시설 철거',sub:'자리를 비웁니다',off:!removable.length},
      {label:'세율 조정',sub:earth?'본성은 고정':`${TAX[c.tax]} → ${TAX[(c.tax+1)%3]}`,off:earth},
      {label:'축제 개최',sub:'충성도 +15',right:fest+'만원',off:earth||S.money<fest||c.loy>=100},
      {label:'중고 무기 매각',sub:hasT?'장비를 반값에':'교역소 필요',off:!hasT},
      {label:'중고 전함 매각',sub:hasT?'전함을 반값에':'교역소 필요',off:!hasT}],`자금 ${S.money}만원`,head);
    if(i<0)return;
    if(i===0){const keys=Object.keys(FAC);
      const j=await listBox('시설 건설',keys.map(k=>{const n=cnt(p,k),co=bcost(p,k);
        return{label:FAC[k].n,sub:FAC[k].d+(n?` · 보유 ${n}`:''),right:co+'만원',off:S.money<co||(FAC[k].uniq&&n>0)}}),`자금 ${S.money}만원 · 빈 자리 ${slots(p)-c.fac.length}`);
      if(j>=0){const k=keys[j];S.money-=bcost(p,k);c.fac.push(k);beep(600,.12);toast(`${FAC[k].n} 건설 완료`);ui()}}
    else if(i===1){const idx=c.fac.map((f,n)=>n).filter(n=>!(earth&&n<3));
      const j=await listBox('시설 철거',idx.map(n=>({label:FAC[c.fac[n]].n,sub:FAC[c.fac[n]].d})),'철거한 시설의 비용은 돌려받지 못합니다.');
      if(j>=0){const k=c.fac.splice(idx[j],1)[0];toast(`${FAC[k].n} 철거`);ui()}}
    else if(i===2){c.tax=(c.tax+1)%3;toast(`세율 ${TAX[c.tax]} · 충성도 ${sign(dl(p))}/월 · 수입 +${inc(p)}/월`);ui()}
    else if(i===3){S.money-=fest;c.loy=Math.min(100,c.loy+15);beep(880,.15);toast(`축제 · 충성도 ${c.loy}%`);ui()}
    else if(i===4){for(;;){const k=await fleetBox('무기와 보호막을 반값에 넘길 전함을 고르세요',s=>s.w>=0||s.sh>=0);if(k<0)break;
      const s=S.fleet[k],v=Math.floor(((s.w>=0?WP[s.w]:0)+(s.sh>=0?SP[s.sh]:0))/2);s.w=-1;s.sh=-1;S.money+=v;ui();beep(520);toast(`+${v}만원`)}}

async function monthTick(){S.month++;let tot=0,labs=0;const reb=[];
  for(const p of PL){if(!owned(p))continue;const c=p.col,T=PT[p.type];if(c.rebel)continue;
    tot+=inc(p);labs+=cnt(p,'lab')*(T.lab||1);
    if(p.role!=='earth'){c.loy=clamp(c.loy+dl(p),0,100);
      if(c.loy<30&&Math.random()<(30-c.loy)*.03*(c.fac.includes('fort')?.5:1)*(T.calm||1)){c.rebel=true;
        const lostF=c.fac.length?FAC[c.fac.splice(ri(0,c.fac.length-1),1)[0]].n:null;reb.push([p,lostF])}}}
  S.money+=tot;let note='';
  const r=S.rsch&&!S.tech[S.rsch]?TB[S.rsch]:null;
  if(r&&labs){S.prog[r.id]=Math.min(100,(S.prog[r.id]||0)+4*labs);if(S.prog[r.id]>=100&&S.exp>=r.exp){learn(r);note=' · '+r.n+' 완성'}}
  if(!note)toast(`${S.month}월 · 수입 +${tot}만원`);
  ui();
  for(const[p,lostF]of reb){beep(140,.4,'sawtooth',.06);await msgBox('반란',`${p.n}에서 반란이 일어났습니다!\n`+(lostF?`폭동으로 ${lostF}이(가) 파괴되었습니다.\n`:'')+'함대를 보내 진압할 때까지 수입이 끊기고 시설을 쓸 수 없습니다.')}
}

/* ---------- enemies ---------- */
function eUnit(fac,big,t){const m7=v=>clamp(v,-1,7);let u;
  switch(fac){
    case'pirate':u=big?{n:'해적 모함',hp:110+25*t,w:t+1,sh:t,sk:'volley'}:{n:'해적선',hp:55,w:Math.min(2,t-1),sh:t>=3?0:-1};break;
    case'machine':u=big?{n:'기계 모선',hp:100+22*t,w:t,sh:t-1,sk:'repair'}:{n:'드론',hp:34+7*t,w:t-1,sh:-1,sd:.4};break;
    case'crystal':u=big?{n:'결정 거함',hp:90+20*t,w:t+1,sh:t+2,shc:.85,sk:'barrier'}:{n:'결정체',hp:34+7*t,w:t-1,sh:t+1,shc:.85};break;
    case'bio':u=big?{n:'생체 모함',hp:140+30*t,w:t,sh:-1,regen:8+2*t,sk:'volley'}:{n:'포자선',hp:58+12*t,w:t-1,sh:-1,regen:4+t};break;
    case'iron':u=big?{n:'중전함',hp:170+35*t,w:t+2,sh:t-2,sk:'snipe'}:{n:'중장갑기',hp:80+16*t,w:t,sh:-1};break;
    default:u=big?{n:'전함',hp:110+25*t,w:t+1,sh:t,sk:'volley'}:{n:'전투기',hp:50+10*t,w:t-1,sh:t>=2?t-2:-1};
  }
  let cls=big?'b':'s';
  if(!big&&fac!=='pirate'&&t>=2){const r=Math.random();
    if(r<.14){u.n='척후기';u.hp=Math.round(u.hp*.6);u.ev=.3;cls='v'}
    else if(r<.28){u.n='포격기';u.hp=Math.round(u.hp*.75);u.w++;cls='a'}}
  return{...u,t:`e:${fac}:${cls}`,max:u.hp,w:m7(u.w),sh:m7(u.sh),tint:FA[fac].c}}
function gen(x,y){
  const dE=cheb(x,y,EARTH()),near=nearEnemy(x,y),t=near?near.tier:0;
  if(dE>2&&Math.random()<.06){const e=eUnit(near?near.fac:'legion',true,Math.max(2,t));e.lone=true;return[e]}
  let n=near?ri(3,5)+(t>3?1:0):(dE<=2?ri(2,3):ri(3,5));if(near&&(near.fac==='iron'||near.fac==='bio'))n--;
  const out=[];
  for(let i=0;i<n;i++)out.push(near&&near.fac!=='pirate'&&Math.random()<.5?eUnit(near.fac,false,t):eUnit('pirate',false,dE<=2?0:Math.max(1,t)));
  return out}
function planetFleet(p){const[b,s]=FA[p.fac].mix,out=[],hq=p.role==='hq';
  for(let i=0;i<b;i++){const e=eUnit(p.fac,true,p.tier);if(hq){e.max+=40;e.hp+=40}out.push(e)}
  for(let i=0;i<s;i++)out.push(eUnit(p.fac,false,p.tier));return out}
function guardFleet(){const out=[];for(let i=0;i<2;i++){const e=eUnit('legion',true,5);e.n='호위 전함';out.push(e)}
  for(let i=0;i<6;i++)out.push(eUnit('legion',false,5));return out}
function rebelFleet(p){const t=Math.max(1,p.tier-1),out=[eUnit(p.fac,true,t)];for(let i=0;i<4;i++)out.push(eUnit(p.fac,false,t));
  out.forEach(e=>e.n='반란 '+e.n);return out}

async function act(s,foes,friends,focus,d){

      case'heon':case'barrier':for(const f of friends)if(f.hp>0)f.thin=true;beep(990,.15);break;
      case'cruiser':for(const e of lf){beam(s,e,1);hit(e,14)}break;
      case'cyl':heal(15);break;
      case'sphere':for(const f of friends)if(f.hp>0)f.wall=25;beep(990,.15);break;
      case'bird':for(const e of lf){beam(s,e,6);hit(e,12,true);if(e.hp>0)hit(e,12,true)}break;
      case'green':for(const e of lf.slice().sort((a,b)=>b.hp-a.hp).slice(0,2)){const v=Math.floor(e.hp/2);if(v>0){beam(s,e,7);e.hp-=v;e.hitAt=now();fl(e,'-'+v,'#fd6')}}break;
      case'frost':for(const e of lf){e.blind=2;fl(e,'실명','#aef')}beep(500,.2,'sine');break;
      case'steel':for(const e of lf){beam(s,e,3);hit(e,10);if(e.hp>0)hit(e,10)}break;

}

  if(hover){const s=shipAt(B.E,hover.x,hover.y)||shipAt(B.A,hover.x,hover.y);
    if(s){const p=B.pos.get(s),skn=ESK[s.sk]||SK[s.t];
      if(B.selecting&&B.E.includes(s)){g.fillStyle='#ffc857';const x0=p.x-8,y0=p.y-8,x1=p.x+140,y1=p.y+56,L=12;
        for(const[cx,cy,sx,sy]of[[x0,y0,1,1],[x1,y0,-1,1],[x0,y1,1,-1],[x1,y1,-1,-1]]){g.fillRect(sx>0?cx:cx-L,cy-(sy>0?0:2),L,2);g.fillRect(cx-(sx>0?0:2),sy>0?cy:cy-L,2,L)}}
      const lab=`${s.n} · ${wn(s)} · ${sn(s)}`+(skn?` · ${skn}`:'')+(s.regen?' · 재생':'')+(s.ev?' · 회피':'')+(s.sd?' · 자폭':'');g.font='14px "Do Hyeon",sans-serif';g.textAlign='left';
      const w=g.measureText(lab).width+12,tx=Math.max(4,Math.min(636-w,p.x)),ty=Math.max(2,p.y-26);
      g.fillStyle='rgba(14,10,8,.92)';g.fillRect(tx,ty,w,19);g.strokeStyle='#ffc857';g.lineWidth=1;g.strokeRect(tx+.5,ty+.5,w-1,18);
      g.fillStyle='#f1ead6';g.fillText(lab,tx+6,ty+14)}}
  g.restore();
  if(t-B.t0<260){g.globalAlpha=1-(t-B.t0)/260;g.fillStyle='#fff';g.fillRect(0,0,640,400);g.globalAlpha=1}
}

/* ---------- loop and input ---------- */
function frame(t){if(mode==='battle'&&B)drawBattle(t);else drawMap(t);requestAnimationFrame(frame)}
function setSpd(v){spd=v;$('bSpd').textContent='속도 ×'+spd;saveSet()}
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(mode==='battle'&&e.code==='Space'){e.preventDefault();setSpd(spd===1?2:spd===2?4:1);return}
  if(keyFn){if(k.length===1||/^Key[A-Z]$/.test(e.code)||['Enter','Escape','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)){keyFn(k,e.code);e.preventDefault()}return}
  if(mode!=='map'||busy)return;
  const mv={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[k]||{KeyW:[0,-1],KeyS:[0,1],KeyA:[-1,0],KeyD:[1,0]}[e.code];
  if(mv){e.preventDefault();move(mv[0],mv[1])}
  else if(/^[0-9]$/.test(k)){e.preventDefault();run(+k||10)}
  else if(k==='F1'){e.preventDefault();help()}
});
const cpos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
cmd.addEventListener('click',e=>{const b=e.target.closest('button[data-n]');if(b)run(+b.dataset.n)});
cv.addEventListener('mousemove',e=>{hover=cpos(e)});
cv.addEventListener('mouseleave',()=>{hover=null});
cv.addEventListener('click',e=>{const{x,y}=cpos(e);
  if(mode==='battle'){if(targetFn)targetFn(x,y);return}
  if(x>=420||y>=310)return;
  const dx=Math.floor((x-OX)/CELL)-S.x,dy=Math.floor((y-OY)/CELL)-S.y;if(!dx&&!dy)return;
  if(Math.abs(dx)>=Math.abs(dy))move(Math.sign(dx),0);else move(0,Math.sign(dy))});
[['pU',0,-1],['pD',0,1],['pL',-1,0],['pR',1,0]].forEach(([id,dx,dy])=>$(id).addEventListener('click',()=>move(dx,dy)));
$('bHelp').addEventListener('click',help);
$('bSpd').addEventListener('click',()=>setSpd(spd===1?2:spd===2?4:1));
$('bSnd').addEventListener('click',e=>{snd=!snd;e.currentTarget.textContent=snd?'소리 켜짐':'소리 꺼짐';saveSet()});
$('bFull').addEventListener('click',()=>{try{if(document.fullscreenElement)document.exitFullscreen();else{const p=$('stage').requestFullscreen();if(p&&p.catch)p.catch(()=>toast('이 화면에서는 전체 화면을 쓸 수 없습니다.'))}}catch(e){toast('이 화면에서는 전체 화면을 쓸 수 없습니다.')}});
$('bNew').addEventListener('click',async()=>{if(busy||mode!=='map')return;busy=true;
  const c=await listBox('새 게임',[{label:'새 은하에서 다시 시작한다',sub:'행성 배치가 새로 만들어집니다'}],'','지금까지의 진행 상황이 지워집니다.');
  if(c===0){setState(newState());save()}busy=false;ui()});

/* ---------- save files ---------- */
function sanitize(o){
  if(!o||typeof o!=='object'||o.v!==2||!Array.isArray(o.fleet)||!Array.isArray(o.pl))return null;
  const num=(v,lo,hi,d)=>Number.isFinite(+v)?Math.max(lo,Math.min(hi,Math.round(+v))):d;
  const flags=(v,ok)=>{const r={};if(v&&typeof v==='object')for(const k of Object.keys(v))if(v[k]&&ok(k))r[k]=true;return r};
  const name=(v,d)=>typeof v==='string'&&/^[가-힣A-Za-z0-9 ]{1,24}$/.test(v)?v:d;
  const roles=['earth','pirate','gold','heon','lover','ok','bonus','hq'];
  const pl=o.pl.slice(0,16).map((p,i)=>{if(!p||typeof p!=='object')return null;
    const type=PT[p.type]?p.type:'rock',size=num(p.size,0,2,1);
    const q={id:'p'+i,n:name(p.n,'이름 없는 별 '+i),x:num(p.x,0,COLS-1,0),y:num(p.y,0,ROWS-1,0),type,size,role:roles.includes(p.role)?p.role:'bonus',
      tier:num(p.tier,0,6,1),fac:FA[p.fac]?p.fac:'legion',seed:num(p.seed,0,9999,0),ring:!!p.ring,pre:FAC[p.pre]?p.pre:null};
    if(p.col&&typeof p.col==='object')q.col={loy:num(p.col.loy,0,100,50),tax:num(p.col.tax,0,2,1),fac:(Array.isArray(p.col.fac)?p.col.fac:[]).filter(f=>FAC[f]).slice(0,7),rebel:!!p.col.rebel};
    return q});
  if(pl.includes(null)||pl.length<3||pl[0].role!=='earth'||pl.filter(p=>p.role==='hq').length!==1||pl.filter(p=>p.role==='earth').length!==1)return null;
  if(!pl[0].col)pl[0].col={loy:100,tax:1,fac:['yard','arsenal','lab'],rebel:false};pl[0].col.rebel=false;
  const ids=pl.map(p=>p.id),conq=flags(o.conq,k=>ids.includes(k)&&k!=='p0');
  for(const p of pl.slice(1)){if(conq[p.id]&&!p.col)p.col={loy:45,tax:1,fac:[],rebel:false};if(!conq[p.id])delete p.col}
  const fleet=o.fleet.slice(0,8).filter(s=>s&&TY[s.t]).map(s=>{const max=num(s.max,1,999,TY[s.t].hp);
    const r={t:s.t,n:TY[s.t].n,max,hp:num(s.hp,1,max,max),w:num(s.w,-1,7,-1),sh:num(s.sh,-1,7,-1)};
    if(typeof s.tint==='string'&&/^#[0-9a-f]{3,6}$/i.test(s.tint))r.tint=s.tint;return r});
  if(!fleet.some(s=>BRO.includes(s.t)))return null;
  const cell=k=>/^\d{1,2},\d{1,2}$/.test(k),tiles={};
  if(o.tiles&&typeof o.tiles==='object')for(const k of Object.keys(o.tiles).slice(0,80))if(cell(k)&&(o.tiles[k]==='a'||o.tiles[k]==='n'))tiles[k]=o.tiles[k];
  let worm=null;if(Array.isArray(o.worm)&&o.worm.length===2&&o.worm.every(q=>Array.isArray(q)&&q.length===2))worm=o.worm.map(q=>[num(q[0],0,COLS-1,0),num(q[1],0,ROWS-1,0)]);
  const tech=flags(o.tech,k=>!!TB[k]);tech.w0=true;const prog={};
  if(o.prog&&typeof o.prog==='object')for(const k of Object.keys(o.prog))if(TB[k]&&!tech[k])prog[k]=num(o.prog[k],0,100,0);
  return{v:2,x:num(o.x,0,COLS-1,pl[0].x),y:num(o.y,0,ROWS-1,pl[0].y),money:num(o.money,0,9999999,0),exp:num(o.exp,0,99999,0),
    loy:num(o.loy,0,100,80),moves:num(o.moves,0,1e9,0),month:num(o.month,1,99999,1),tech,prog,rsch:TB[o.rsch]&&!tech[o.rsch]?o.rsch:null,fleet,pl,tiles,worm,
    conq,info:flags(o.info,k=>ids.includes(k)),guard:flags(o.guard,cell),joined:flags(o.joined,k=>['gu','ok','heon'].includes(k)),lover:!!o.lover}}
function textBox(title,text,value){return new Promise(res=>{
  openDlg(`<div class="win"><h2>${title}</h2><div class="body"><div class="txt">${text}</div><textarea id="saveText" readonly></textarea></div><div class="foot"><button data-i="1">복사</button><button data-i="0"><kbd>↵</kbd>닫기</button></div></div>`);
  const ta=$('saveText');ta.value=value;
  const done=()=>{closeDlg();res()};
  dlg.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.i==='1'){ta.select();const ok=()=>toast('복사했습니다.');try{navigator.clipboard.writeText(value).then(ok,()=>toast('선택된 내용을 직접 복사하세요.'))}catch(err){toast('선택된 내용을 직접 복사하세요.')}}else done()};
  keyFn=k=>{if(k==='Enter'||k==='Escape')done();return true};})}
async function saveFile(){if(busy||mode!=='map')return;busy=true;
  try{save();const d=new Date(),pad=n=>String(n).padStart(2,'0');
    const fname=`별빛 섬광 ${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
    const data=JSON.stringify({game:'sevenstars',version:2,saved:d.toISOString(),state:S},null,1);
    const fallback='이 화면에서는 파일 저장을 쓸 수 없습니다. 아래 내용을 복사해 .json 파일로 저장하면 불러오기에 쓸 수 있습니다.';
    let dn=null;try{dn=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
    if(dn){try{await dn.save({filename:fname,data});toast('세이브 파일을 저장했습니다.')}
      catch(e){const c=e&&e.code;
        if(c==='declined')toast('저장을 취소했습니다.');
        else if(c==='rate_limited')toast('저장 창이 이미 열려 있습니다. 잠시 뒤 다시 누르세요.');
        else await textBox('세이브 내보내기',fallback,data)}}
    else await textBox('세이브 내보내기',fallback,data);
  }finally{busy=false}}
function loadFile(file){if(!file)return;if(busy||mode!=='map'){toast('전투나 창을 끝낸 뒤 불러오세요.');return}
  const fr=new FileReader();
  fr.onerror=()=>toast('파일을 읽지 못했습니다.');
  fr.onload=async()=>{let st=null,old=false;try{const o=JSON.parse(fr.result);old=o&&o.version===1;st=sanitize(o&&o.state?o.state:o)}catch(e){}
    if(!st){toast(old?'이전 버전 세이브는 새 은하 구조와 맞지 않아 불러올 수 없습니다.':'별빛 섬광 세이브 파일이 아닙니다.');return}
    if(busy||mode!=='map')return;busy=true;
    const c=await listBox('세이브 불러오기',[{label:'이 파일로 이어서 한다',sub:`${st.month}월 · 영토 ${1+Object.keys(st.conq).length} · 전함 ${st.fleet.length}척 · 자금 ${st.money}만원`}],'','지금 진행 중인 게임은 불러온 내용으로 바뀝니다.');
    if(c===0){setState(st);save();toast('세이브를 불러왔습니다.')}
    busy=false;ui()};
  fr.readAsText(file)}
$('bSave').addEventListener('click',saveFile);
$('bLoad').addEventListener('click',()=>{if(busy||mode!=='map'){toast('전투나 창을 끝낸 뒤 불러오세요.');return}$('fLoad').value='';$('fLoad').click()});
$('fLoad').addEventListener('change',e=>loadFile(e.target.files[0]));
scr.addEventListener('dragover',e=>e.preventDefault());
scr.addEventListener('drop',e=>{e.preventDefault();loadFile(e.dataTransfer.files[0])});

async function title(){
  const sv=load();setState(sv||newState());ui();busy=true;
  const items=sv?[{label:'이어하기',sub:`${sv.month}월 · 영토 ${1+Object.keys(sv.conq).length} · 전함 ${sv.fleet.length}척`},{label:'새 게임',sub:'새 은하'}]:[{label:'게임 시작'}];
  const c=await listBox('',items,'방향키/WASD 이동 · 숫자키 명령',
    `<div class="logo"><span>${['#5a78ff','#ee3333','#5fd0c0','#ff7ad0','#9be04a','#ffb040','#b9a8ff'].map(c=>`<i style="background:${c}"></i>`).join('')}</span><b>별빛 섬광</b></div>`+
    '지구 근처 우주에 낯선 인공 행성들이 나타났다. 실종된 동생과 둘째 형이 그 어딘가에 잡혀 있다는 소문이 돈다.\n지구 방위군은 이번에는 돕지 않는다. 큰형 한울만이 지구 근처의 전투를 돕기로 했다.','title');
  if(sv&&c===1){setState(newState());save()}
  busy=false;ui();
}
setState(newState());fit();$('bSpd').textContent='속도 ×'+spd;$('bSnd').textContent=snd?'소리 켜짐':'소리 꺼짐';
requestAnimationFrame(frame);title();
if(document.fonts&&document.fonts.load)document.fonts.load('24px "Do Hyeon"').catch(()=>{});
})();
</script>
